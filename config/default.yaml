# Stock-Comber configuration
#
# Every value below is adjustable. Copy this file, edit the thresholds, and pass
# it with `stock-comber --config my-config.yaml screen`. Anything you omit falls
# back to the built-in defaults in stock_comber/config.py.

strategies: [graham, buffett]

universe:
  # Explicit tickers to comb. Leave empty to pull the full SEC ticker list
  # (capped by `limit`).
  tickers: []
  limit: 500

data:
  # SEC EDGAR requires a descriptive User-Agent that includes a contact email.
  user_agent: "Stock-Comber (bobchang711@gmail.com)"
  cache_dir: ".cache/stock_comber"
  cache_ttl_hours: 24
  request_timeout: 30
  request_delay_seconds: 0.2
  min_annual_years: 3

# Benjamin Graham "defensive investor" criteria.
graham:
  min_revenue: 700000000
  min_current_ratio: 2.0
  max_debt_to_equity: 1.0
  long_term_debt_under_working_capital: true
  positive_earnings_years: 5
  require_dividend: false
  min_earnings_growth_pct: 33.0
  earnings_growth_years: 5
  max_pe: 15.0
  max_pb: 1.5
  max_pe_times_pb: 22.5
  require_positive_book_value: true
  pass_ratio: 0.8

# Warren Buffett quality/moat criteria.
buffett:
  min_roe_pct: 15.0
  roe_consistency_years: 5
  max_debt_to_equity: 0.5
  min_net_margin_pct: 10.0
  min_earnings_growth_pct: 50.0
  earnings_growth_years: 5
  require_positive_fcf: true
  min_fcf_years: 3
  pass_ratio: 0.8

# User-defined custom criteria. Add "custom" to `strategies` above to run them.
# metric: any key from the computed metric bundle, e.g. pe_ratio, pb_ratio,
#   roe_pct, net_margin_pct, current_ratio, debt_to_equity, graham_number,
#   free_cash_flow, eps, revenue, earnings_growth_5y_pct, revenue_growth_5y_pct.
# op: one of <= < >= > == !=
custom:
  pass_ratio: 1.0
  criteria: []
  # criteria:
  #   - {name: "Cheap earnings", metric: pe_ratio, op: "<=", value: 12}
  #   - {name: "High quality", metric: roe_pct, op: ">=", value: 20}
  #   - {metric: debt_to_equity, op: "<=", value: 0.5}

output:
  dir: "reports"
  formats: [json, csv, markdown, rss]
  only_passing: false
  top_n: 50
  sort_by: score_pct
  # Absolute base URL used for links in the nightly RSS digest (reports/latest.xml,
  # published to /feed.xml). Point this at your deployed dashboard.
  site_url: "https://github.com/Bobs-Dev-Attic/Stock-Comber"

# Local scheduler (see stock_comber/scheduler.py). For hosted scheduling use the
# GitHub Actions workflow instead.
schedule:
  enabled: false
  cron: "0 6 * * 1-5"
  timezone: "UTC"
