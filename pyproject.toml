[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-comber"
version = "0.77.0"
description = "Find publicly traded companies that fit Graham and Buffett value-investing criteria, using free data sources."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bob Chang", email = "bobchang711@gmail.com" }]
keywords = ["value-investing", "stocks", "graham", "buffett", "screener", "sec-edgar"]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
schedule = ["apscheduler>=3.10"]
storage = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7.0", "mypy>=1.8"]

[project.scripts]
stock-comber = "stock_comber.cli:main"

[project.urls]
Homepage = "https://github.com/Bobs-Dev-Attic/Stock-Comber"

[tool.setuptools.packages.find]
include = ["stock_comber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lenient to start (the codebase predates type hints); CI runs mypy non-blocking.
# Ratchet these on over time: ignore_missing_imports -> typed stubs, then enable
# disallow_untyped_defs per-module.
[tool.mypy]
# Analysis target (the package still runs on 3.9; syntax stays 3.9-compatible).
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
