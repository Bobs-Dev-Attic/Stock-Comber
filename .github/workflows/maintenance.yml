name: Maintenance

# Manual, admin-only database maintenance. Nothing here runs on a schedule.
on:
  workflow_dispatch:
    inputs:
      purge_strategy:
        description: "Permanently delete every stored result for this strategy (e.g. custom)"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[storage]"
      - name: Purge strategy results
        env:
          PURGE_STRATEGY: ${{ github.event.inputs.purge_strategy }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$PURGE_STRATEGY" ]; then
            echo "No purge_strategy provided; nothing to do."
            exit 0
          fi
          stock-comber --config config/default.yaml --verbose \
            purge-strategy --strategy "$PURGE_STRATEGY" --yes
