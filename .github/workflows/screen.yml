name: Scheduled screen

# Combs free data sources and commits the fresh reports. The *stored* schedule
# (Jobs tab → Scheduled report, saved to the database) decides when this fires:
# the cron below is a 5-minute heartbeat, and the `schedule-gate` step checks the
# stored schedule each tick and only proceeds when the configured time matches
# (to a 5-minute resolution — GitHub's minimum). When no schedule is stored (or
# no DATABASE_URL is set), it defaults to 06:30 UTC on weekdays — the original
# behaviour. A manual dispatch always runs.
on:
  schedule:
    # Every 5 minutes (GitHub's finest schedule resolution) — schedule-gate
    # decides whether this tick actually runs. Keep in sync with
    # stock_comber/schedule.py HEARTBEAT_MINUTES.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Use the nightly 'hidden gems' universe (true) or a plain SEC-list cap"
        required: false
        default: "true"
      limit:
        description: "When nightly=false, cap the SEC ticker universe"
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  group: scheduled-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # [storage] pulls psycopg so runs persist when DATABASE_URL is set.
          pip install -e ".[storage]"

      # Consult the stored schedule. On a manual dispatch we always run; on the
      # hourly heartbeat we run only when the stored schedule matches this hour.
      - name: Schedule gate
        id: gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual dispatch — running regardless of the stored schedule."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            stock-comber --config config/default.yaml schedule-gate
          fi

      - name: Run screen
        if: steps.gate.outputs.run == 'true'
        env:
          NIGHTLY: ${{ github.event.inputs.nightly || 'true' }}
          LIMIT: ${{ github.event.inputs.limit || '50' }}
          # Optional: set these repo secrets to persist runs / enable Finnhub.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ "$NIGHTLY" = "false" ]; then
            stock-comber --config config/default.yaml --verbose screen --limit "$LIMIT"
          else
            stock-comber --config config/default.yaml --verbose screen --nightly
          fi

      - name: Re-check investment theses
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: stock-comber --config config/default.yaml --verbose check-theses

      - name: Publish latest report to the dashboard
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p public/data
          cp reports/latest.json public/data/latest.json

      - name: Commit reports
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/latest.* reports/screen-*.* public/data/latest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore(reports): scheduled screen $(date -u +%Y-%m-%d)"
            git push
          fi
