name: Scheduled screen

# Combs free data sources on a schedule and commits the fresh reports.
# Adjust the cron below, or edit config/default.yaml to tune the criteria.
on:
  schedule:
    # 06:30 UTC every weekday. Change to taste.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Cap the SEC ticker universe"
        required: false
        default: "500"

permissions:
  contents: write

concurrency:
  group: scheduled-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # [storage] pulls psycopg so runs persist when DATABASE_URL is set.
          pip install -e ".[storage]"

      - name: Run screen
        env:
          LIMIT: ${{ github.event.inputs.limit || '500' }}
          # Optional: set these repo secrets to persist runs / enable Finnhub.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          stock-comber --config config/default.yaml --verbose screen --limit "$LIMIT"

      - name: Publish latest report to the dashboard
        run: |
          mkdir -p public/data
          cp reports/latest.json public/data/latest.json

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/latest.* reports/screen-*.* public/data/latest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore(reports): scheduled screen $(date -u +%Y-%m-%d)"
            git push
          fi
